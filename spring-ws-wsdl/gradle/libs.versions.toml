[versions]
javaxJaxbApi =  "2.3.1"
jetbrainsAnnotations = "24.1.0"
lombok = "1.18.30"

slf4j = "1.7.36"
logback = "1.2.13"
apacheLog4j = "2.21.1"

springBoot = "2.7.18"
springBootDependencyManagement = "1.1.6"
spring = "5.3.39"

# tests
testLogger = "4.0.0"
junitJupiter = "5.8.2"
junitPlatformLauncher = "1.8.2"
hamcrest = "2.2"

wsdl2java = "2.0.2"

[plugins]
testLogger =  { id = "com.adarshr.test-logger", version.ref = "testLogger" }
wsdl2java =  { id = "com.github.bjornvester.wsdl2java", version.ref = "wsdl2java" }

[libraries]
# These are Maven coordinates for Gradle plugins, which is necessary to use them in precompiled plugin scripts.
# ======================================================
# https://mvnrepository.com/artifact/com.adarshr.test-logger/com.adarshr.test-logger.gradle.plugin
# implementation("com.adarshr.test-logger:com.adarshr.test-logger.gradle.plugin:4.0.0")
plugin-testLogger = { module = "com.adarshr.test-logger:com.adarshr.test-logger.gradle.plugin", version.ref = "testLogger" }

# https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-gradle-plugin
plugin-springBoot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }

# https://mvnrepository.com/artifact/io.spring.gradle/dependency-management-plugin
plugin-springBootDependencyManagement = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springBootDependencyManagement" }
# ======================================================

# https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }

# https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-web-services
spring-boot-starter-web-services  = { module = "org.springframework.boot:spring-boot-starter-web-services", version.ref = "springBoot" }

# https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-configuration-processor
spring-boot-configuration = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }

# https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-security
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBoot" }


# https://mvnrepository.com/artifact/org.jetbrains/annotations
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }

# https://mvnrepository.com/artifact/org.projectlombok/lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# https://mvnrepository.com/artifact/org.slf4j/slf4j-api
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# https://mvnrepository.com/artifact/ch.qos.logback/logback-core
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }

# https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-to-slf4j
apache-log4j-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "apacheLog4j" }

# tests
# ======================================================

# https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }

# https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }

# https://mvnrepository.com/artifact/org.hamcrest/hamcrest
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

# https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-test
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }

# https://mvnrepository.com/artifact/org.springframework/spring-test
spring-test = { module = "org.springframework:spring-test", version.ref = "spring" }

# https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
javax-jaxbApi  = { module = "javax.xml.bind:jaxb-api" , version.ref =  "javaxJaxbApi"}